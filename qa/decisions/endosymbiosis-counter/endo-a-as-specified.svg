<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1f33"/><stop offset="1" stop-color="#060e1a"/></linearGradient></defs><rect width="560" height="620" fill="url(#bg)"/><rect x="1" y="1" width="558" height="618" fill="none" stroke="#173250" stroke-width="2" rx="8"/><text x="28" y="44" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#8fb3c9">A · As specified (today)</text><text x="28" y="70" font-family="DejaVu Sans" font-size="15" fill="#8fb3c9">One rung at a time: the orbit shows only the next gate.</text><line x1="28" y1="86" x2="532" y2="86" stroke="#173250" stroke-width="1.5"/><text x="280" y="108" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" fill="#8fb3c9">stage endosymbiosis  ·  chloroplast owned  ·  aerobic tally banked at 10 of 10</text><path d="M 317.0 421.1 A 126.63999999999999 126.63999999999999 0 0 1 243.0 421.1" fill="none" stroke="#0b1b2a" stroke-opacity="0.66" stroke-width="34" stroke-linecap="round"/><circle cx="280" cy="300" r="76" fill="#8fd3e3" fill-opacity="0.28" stroke="#22c1d6" stroke-opacity="0.8" stroke-width="3"/><circle cx="280" cy="300" r="71" fill="#63d64a" fill-opacity="0.10"/><circle cx="280" cy="300" r="22.8" fill="#7fe7f5" fill-opacity="0.26" stroke="#e4faff" stroke-opacity="0.8" stroke-width="2"/><circle cx="280" cy="300" r="36.48" fill="none" stroke="#0b1b2a" stroke-opacity="0.6" stroke-width="7"/><circle cx="280" cy="300" r="36.48" fill="none" stroke="#d36bff" stroke-width="5" stroke-linecap="round" stroke-dasharray="77.9 229.2" transform="rotate(-90 280 300)"/><text x="280" y="306" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#ffffff">3</text><ellipse cx="315.0" cy="268.1" rx="16.0" ry="9.9" fill="#63d64a" stroke="#b8ff9a" stroke-width="1.5" transform="rotate(-24 315.0 268.1)"/><circle cx="280" cy="300" r="86.63999999999999" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="9 7"/><circle cx="280.0" cy="426.6" r="15" fill="none" stroke="#dff8ff" stroke-opacity="0.7" stroke-width="2.4" stroke-dasharray="4.5 3.5"/><circle cx="295.0" cy="426.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><circle cx="287.5" cy="439.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><circle cx="272.5" cy="439.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><circle cx="265.0" cy="426.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><circle cx="272.5" cy="413.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><circle cx="287.5" cy="413.6" r="2.6" fill="#7fe7f5" fill-opacity="0.85"/><text x="280.0" y="460.6" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#8fb3c9">envelope (next rung)</text><text x="28" y="546" font-family="DejaVu Sans" font-size="15" fill="#dfeaf2">Picking an endosymbiont promotes the cell out of prokaryote, so</text><text x="28" y="568" font-family="DejaVu Sans" font-size="15" fill="#dfeaf2">both counters disappear at once. The banked aerobic tally is gone</text><text x="28" y="590" font-family="DejaVu Sans" font-size="15" fill="#dfeaf2">even though the mitochondrion is still an eligible draft card.</text></svg>