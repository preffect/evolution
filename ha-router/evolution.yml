# ha-router route template for evolution
# ----------------------------------------------------------------------------
# Copy this to the REAL ha-router repo as:  ha-router/config/evolution.yml
# Then replace the placeholders below. Traefik (file provider, watch:true)
# picks the file up automatically — NO restart needed.
#
# PLACEHOLDERS (replace every occurrence):
#   evolution          URL slug + host label   (default suggestion: evolution)
#   4400   server API+WS+MCP port  (default: 4400)
#   4402   Angular client port     (default: 4402)
#
# MODEL: single-port multiplayer (super-morris-girls pattern).
#   ONE backend on 4400 serves /api + /ws + /debug-mcp.
#   The Angular dev server on 4402 serves the UI.
#   3 routers, all on Host(`evolution.preffect-ha.preffect-home.net`):
#     - evolution-api  -> PathPrefix(/api) -> evolution-api service (4400)
#     - evolution-ws   -> PathPrefix(/ws)  -> evolution-api service (4400)
#     - evolution      -> everything else  -> evolution service     (4402)
#   The /api and /ws routers use priority 100 so their PathPrefix rules win
#   (must exceed the catch-all's DEFAULT priority = its rule length, ~55;
#   the old value 20 silently lost and /api only worked via the Angular proxy)
#   over the catch-all client router.
#
#   Do NOT add a separate WebSocket entrypoint — /ws rides the standard
#   websecure entrypoint to the single backend (this is the morris model,
#   simpler than treebeards' dual-port setup).
# ----------------------------------------------------------------------------
http:
  routers:
    evolution-api:
      rule: "Host(`evolution.preffect-ha.preffect-home.net`) && PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: evolution-api
      tls:
        certResolver: cloudflare
      priority: 100

    evolution-ws:
      rule: "Host(`evolution.preffect-ha.preffect-home.net`) && PathPrefix(`/ws`)"
      entryPoints: [websecure]
      service: evolution-api
      tls:
        certResolver: cloudflare
      priority: 100

    # OPTIONAL: only if you want the MCP debug endpoint reachable remotely.
    # Otherwise leave commented — debug-mcp is normally used over localhost.
    # evolution-mcp:
    #   rule: "Host(`evolution.preffect-ha.preffect-home.net`) && PathPrefix(`/debug-mcp`)"
    #   entryPoints: [websecure]
    #   service: evolution-api
    #   tls:
    #     certResolver: cloudflare
    #   priority: 100

    evolution:
      rule: "Host(`evolution.preffect-ha.preffect-home.net`)"
      entryPoints: [websecure]
      service: evolution
      tls:
        certResolver: cloudflare

  services:
    evolution:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4402"

    evolution-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4400"

# ----------------------------------------------------------------------------
# OPTIONAL — WebSocket upgrade fix (only if /ws fails to upgrade behind TLS).
# Some clients/proxies negotiate HTTP/2 and break the WS Upgrade handshake.
# If you hit that, pin TLS to HTTP/1.1 on the three routers above by adding
# `options: evolution-no-h2@file` under each router's `tls:` block, and append
# the block below (mirrors solar-drift.yml). Leave it out unless WS breaks.
# ----------------------------------------------------------------------------
# tls:
#   options:
#     evolution-no-h2:
#       alpnProtocols:
#         - http/1.1
